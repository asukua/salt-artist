name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test and package
        shell: pwsh
        run: .\gradlew.bat --no-daemon test plugin

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath build/libs -Filter '*.spmod' | ForEach-Object {
            $artifactHash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath ($_.FullName + '.sha256') -Value ($artifactHash + '  ' + $_.Name) -Encoding ascii
          }

      - name: Upload plugin and test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: salt-artist
          path: |
            build/libs/*.spmod
            build/libs/*.spmod.sha256
            build/reports/tests/test/
          if-no-files-found: error
